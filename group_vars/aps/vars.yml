---
ansible_user: root
# Dropbear has no sftp-server, and OpenSSH's scp uses SFTP: transfer files over the SSH session.
openwrt_ssh_transfer_method: piped

# Pulls in coreutils-sha1sum (needed for checksums of template/copy).
openwrt_install_recommended_packages: true

timezone: CET-1CEST,M3.5.0,M10.5.0/3
zonename: Europe/Zurich

# All switch ports bridged into the LAN (WAN port included).
lan_ports: [lan1, lan2, lan3, lan4, wan]

wifi_country: CH
# Cudy WR3000S v1
wifi_radio_paths:
  2g: platform/soc/18000000.wifi
  5g: platform/soc/18000000.wifi+1
wifi_htmode:
  2g: HE20
  5g: HE80

# One wifi-iface per network and band. ft: 802.11r with locally generated keys (PSK only).
# Mobility domain: OpenWrt default, derived from the SSID (same on all APs, unique per SSID).
wifi_networks:
  - id: internal
    ssid: "{{ vault_wifi_internal_ssid }}"
    network: lan
    key: "{{ vault_wifi_internal_key }}"
    ft: true
  - id: guest
    ssid: "{{ vault_wifi_guest_ssid }}"
    network: guest
    key: "{{ vault_wifi_guest_key }}"
    ft: true

# Guest clients may only reach the internet.
guest_blocked_subnets: [192.168.1.0/24, 192.168.71.0/24]
guest_dhcp_leasetime: 12h

ssh_authorized_keys:
  - ssh-rsa  noah@archy

# Restore the config backup if the AP is unreachable rollback_timeout seconds after a change.
# Disable (-e rollback=false) only for the bootstrap of a fresh AP, whose IP changes.
rollback: true
rollback_timeout: 300
